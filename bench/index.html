<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fluid benchmark</title>
    <style>
      body { margin: 24px auto; padding: 0 16px; max-width: 800px; font: 16px system-ui; color-scheme: dark; color: #e6ebf2; background: #12151a; }
      label, button { margin-right: 8px; }
      canvas { display: block; width: 100%; max-width: 640px; margin: 16px 0; border: 1px solid #414955; }
      pre { white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <h1>Fluid benchmark</h1>
    <label for="scene">Stroke</label>
    <select id="scene">
      <option value="line">Thin line</option>
      <option value="spiral">Fast spiral</option>
      <option value="wall">Wall drag</option>
    </select>
    <label for="transport">Dye advection</label>
    <select id="transport">
      <option value="maccormack">Limited MacCormack</option>
      <option value="linear">Linear baseline</option>
    </select>
    <label for="diffusion">Diffusion iterations</label>
    <select id="diffusion">
      <option>1</option>
      <option selected>2</option>
      <option>3</option>
      <option>20</option>
    </select>
    <label for="resolution">Dye resolution</label>
    <select id="resolution">
      <option value="256">256 × 256</option>
      <option value="512">512 × 512</option>
    </select>
    <button id="run">Run benchmark</button>
    <canvas width="640" height="480" aria-label="Fluid replay"></canvas>
    <pre id="results" role="status">Ready</pre>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
